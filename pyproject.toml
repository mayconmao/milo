[project]
name = "milo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maycon Silva", email = "maycon.mao@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
milo = "milo:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
